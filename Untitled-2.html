    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&family=Noto+Sans+TC:wght@400;500;900&display=swap');
        
        :root { --accent: #6366f1; }
        
        body { 
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; 
            background: #000; color: #fff;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 110px;
            overflow-x: hidden;
        }

        .bg-glow {
            position: fixed; top: -5%; left: 50%; transform: translateX(-50%);
            width: 140vw; height: 35vh;
            background: radial-gradient(circle at 50% 0%, var(--accent), transparent 75%);
            opacity: 0.18; z-index: -1; filter: blur(80px);
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.25rem;
        }

        .text-label { @apply text-white/40 font-bold tracking-widest text-[10px] uppercase; }

        /* 頁面切換動畫 */
        .page-content { display: none; animation: pageIn 0.4s ease forwards; }
        .page-content.active { display: block; }

        @keyframes pageIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .nav-item { @apply flex flex-col items-center p-4 opacity-30 transition-all; }
        .nav-item.active { @apply opacity-100 scale-110; color: #818cf8; }

        .life-card { @apply glass p-4 aspect-[1.1/1] flex flex-col justify-between relative overflow-hidden; }
        .life-icon-box { @apply w-9 h-9 rounded-xl flex items-center justify-center mb-1 bg-white/10 text-indigo-300; }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        .style-btn { @apply px-4 py-2 rounded-full text-[12px] font-bold transition-all border border-white/10 text-white/40 whitespace-nowrap; }
        .style-btn.active { background: #fff; color: #000; border-color: #fff; }

        .select-custom {
            background-color: #ffffff !important;
            color: #000000 !important;
            @apply border-none text-[13px] rounded-xl px-3 py-2 outline-none cursor-pointer font-bold;
            min-width: 100px;
            appearance: auto;
        }

        #location-selector { display: none; }

        .heart-btn.active { color: #ff4b4b !important; filter: drop-shadow(0 0 5px rgba(255,75,75,0.4)); }
        .closet-btn.active { color: #22c55e !important; }

        .history-card {
            @apply glass min-w-[130px] p-3 flex flex-col gap-1 shrink-0 transition-all active:scale-95 border-white/5;
            background: rgba(255, 255, 255, 0.03);
        }
    </style>
</head>

        // 核心邏輯
        function toggleSelector() { const el = document.getElementById('location-selector'); el.style.display = el.style.display === 'flex' ? 'none' : 'flex'; }
        function initSelectors() { const citySel = document.getElementById('city-select'); citySel.innerHTML = '<option value="">縣市</option>' + Object.keys(twData).map(c => `<option value="${c}">${c}</option>`).join(''); updateDistricts(); }
        function updateDistricts() { const city = document.getElementById('city-select').value; const distSel = document.getElementById('dist-select'); distSel.innerHTML = city ? twData[city].map(d => `<option value="${d}">${d}</option>`).join('') : '<option value="">地區</option>'; }
        
        async function confirmLocation() { 
            const city = document.getElementById('city-select').value, dist = document.getElementById('dist-select').value; 
            if (!city || !dist) return; 
            const fullName = city + dist; 
            document.getElementById('location-name').innerText = fullName; 
            toggleSelector(); 
            try { 
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${fullName}`); 
                const data = await res.json(); 
                if (data.length > 0) fetchWeather(data[0].lat, data[0].lon); 
            } catch (e) { console.error("座標解析錯誤"); } 
        }

        async function getLocation() { 
            navigator.geolocation.getCurrentPosition(async (pos) => { 
                const lat = pos.coords.latitude, lon = pos.coords.longitude; 
                fetchWeather(lat, lon); 
                try { 
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`); 
                    const data = await res.json(); 
                    const city = data.address.city || data.address.county || ""; 
                    const district = data.address.suburb || data.address.district || data.address.town || ""; 
                    document.getElementById('location-name').innerText = (city + district) || "當前定位位置"; 
                } catch (e) { document.getElementById('location-name').innerText = "當前定位位置"; } 
            }, () => { 
                fetchWeather(24.16, 120.68); 
                document.getElementById('location-name').innerText = "台中市北區"; 
            }); 
        }

        async function fetchWeather(lat, lon) { 
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=precipitation_probability,relativehumidity_2m,dewpoint_2m,uv_index,cloudcover,visibility,windspeed_10m,windgusts_10m,surface_pressure&daily=temperature_2m_max,temperature_2m_min&timezone=auto`; 
            const res = await fetch(url); 
            currentData = await res.json(); 
            updateUI(currentData); 
        }

        function updateUI(data) {
            const h = new Date().getHours();
            document.getElementById('date-now').innerText = new Date().toLocaleDateString('zh-TW', { month: 'short', day: 'numeric', weekday: 'long' });
            document.getElementById('temp-display').innerText = Math.round(data.current_weather.temperature);
            document.getElementById('pop-display').innerText = data.hourly.precipitation_probability[h] + '%';
            document.getElementById('hum-display').innerText = data.hourly.relativehumidity_2m[h] + '%';
            document.getElementById('det-dewpoint').innerText = Math.round(data.hourly.dewpoint_2m[h]);
            document.getElementById('det-gust').innerText = Math.round(data.hourly.windgusts_10m[h]);
            document.getElementById('det-pressure').innerText = Math.round(data.hourly.surface_pressure[h]);
            document.getElementById('det-visibility').innerText = (data.hourly.visibility[h] / 1000).toFixed(1);
            renderOOTD();
            renderLifeStats(data);
            renderWeekly(data.daily);
            lucide.createIcons();
        }

        function renderLifeStats(data) {
            const h = new Date().getHours();
            const pop = data.hourly.precipitation_probability[h], gust = data.hourly.windgusts_10m[h], vis = data.hourly.visibility[h] / 1000, cloud = data.hourly.cloudcover[h], dew = data.hourly.dewpoint_2m[h], uv = data.hourly.uv_index[h];
            const stats = [
                { label: "外送員決策", val: pop > 60 || gust > 40 ? "高單/避雨" : "穩定出車", desc: gust > 35 ? "⚠️ 強陣風" : "天氣穩定", icon: "bike" },
                { label: "攝影窗口", val: vis > 18 && cloud < 30 ? "黃金通透" : "光線平平", desc: `${vis.toFixed(1)}km`, icon: "camera" },
                { label: "體感悶熱度", val: dew > 23 ? "悶熱難耐" : "乾爽舒適", desc: `${Math.round(dew)}°C`, icon: "thermometer-sun" },
                { label: "洗車指數", val: pop > 25 ? "建議延後" : "非常適合", desc: "48H內無大雨", icon: "car" },
                { label: "雨具準備", val: pop < 20 ? "無需攜帶" : "摺疊傘備用", desc: `${pop}%`, icon: "umbrella" },
                { label: "視距/空品", val: vis < 5 ? "視線欠佳" : "視野清晰", desc: `${vis.toFixed(1)}km`, icon: "eye" },
                { label: "風場動態", val: gust > 25 ? "不宜露營" : "微風宜人", desc: `${Math.round(gust)}km/h`, icon: "wind" },
                { label: "紫外線防護", val: uv > 6 ? "加強防曬" : "低強度", desc: `UV ${uv}`, icon: "sun" },
                { label: "曬衣指數", val: cloud < 50 && pop < 10 ? "極速乾燥" : "一般乾燥", desc: `${cloud}%`, icon: "shirt" },
                { label: "戶外運動", val: gust > 30 || pop > 40 ? "室內運動" : "適合活動", desc: "環境優良", icon: "activity" }
            ];
            document.getElementById('life-grid').innerHTML = stats.map(s => `
                <div class="life-card">
                    <div class="life-icon-box"><i data-lucide="${s.icon}" class="w-4 h-4"></i></div>
                    <div>
                        <p class="text-[9px] font-bold text-white/30 mb-0.5 uppercase">${s.label}</p>
                        <p class="text-[11px] font-bold text-white leading-tight mb-1">${s.val}</p>
                        <p class="text-[9px] text-white/40 border-t border-white/5 pt-1 mt-1">${s.desc}</p>
                    </div>
                </div>`).join('');
            document.getElementById('life-tip').innerText = pop > 30 ? "環境濕度高且有雨，建議搭配防水噴霧或機能外套。" : "目前氣候穩定，適合輕便多層次穿搭與戶外活動。";
        }

        function renderOOTD() {
            if (!currentData.current_weather) return;
            const temp = Math.round(currentData.current_weather.temperature);
            const style = styleDB[currentStyle];
            const getRand = (arr) => arr[Math.floor(Math.random() * arr.length)];
            
            currentOutfitArr = [
                { name: getRand(style.tops), type: "上身", icon: "shirt" },
                { name: getRand(style.bottoms), type: "下身", icon: "columns" },
                { name: getRand(style.outer), type: "外層", icon: "layers" },
                { name: getRand(style.shoes), type: "鞋履", icon: "footprints" }
            ];

            document.getElementById('ootd-items').innerHTML = currentOutfitArr.map(item => `
                <div class="flex items-center justify-between py-4 border-b border-white/5 last:border-none px-2 group">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-white/20"><i data-lucide="${item.icon}" class="w-4 h-4"></i></div>
                        <div class="flex flex-col">
                            <span class="text-[8px] text-indigo-400 font-bold uppercase tracking-widest mb-0.5">${item.type}</span>
                            <span class="text-sm font-bold text-white/90 group-hover:text-white transition-colors">${item.name}</span>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="this.classList.toggle('active')" class="closet-btn text-white/10 hover:text-indigo-400 transition-all p-1">
                            <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                        </button>
                        <button onclick="this.classList.toggle('active')" class="heart-btn text-white/10 hover:text-red-400 transition-all p-1">
                            <i data-lucide="heart" class="w-4 h-4 fill-current"></i>
                        </button>
                    </div>
                </div>`).join('');
            
            updateColorGuide(temp);
            const quotes = ["「穿搭是你的名片。」", "「風格是你的態度。」", "「今天也要穿得精采。」"];
            document.getElementById('philosophy-quote').innerText = quotes[Math.floor(Math.random()*quotes.length)];
            lucide.createIcons();
        }

        function saveCurrentOutfit() {
            if (currentOutfitArr.length === 0) return;
            const record = {
                id: Date.now(),
                style: currentStyle,
                colorHex: document.getElementById('color-dot').style.backgroundColor,
                date: new Date().toLocaleDateString('zh-TW', {month:'numeric', day:'numeric'}),
                top: currentOutfitArr[0].name
            };
            historyRecords.unshift(record);
            if (historyRecords.length > 5) historyRecords.pop();
            updateHistoryUI();
        }

        function updateHistoryUI() {
            const container = document.getElementById('history-container');
            document.getElementById('history-count').innerText = `${historyRecords.length} RECORD`;
            if (historyRecords.length === 0) return;

            container.innerHTML = historyRecords.map(h => `
                <div class="history-card">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[9px] font-black text-white/60">${h.date}</span>
                        <div class="w-2 h-2 rounded-full" style="background: ${h.colorHex}"></div>
                    </div>
                    <span class="text-[10px] text-indigo-300 font-bold uppercase">${h.style}</span>
                    <span class="text-[10px] font-bold text-white/40 truncate">${h.top}</span>
                </div>
            `).join('');
        }

        function updateColorGuide(temp) {
            const h = new Date().getHours();
            const pop = currentData.hourly ? currentData.hourly.precipitation_probability[h] : 0;
            let color = { name: "經典黑白", hex: "#ffffff" };
            if (pop > 40) color = { name: "警示亮橘", hex: "#ff8c00" };
            else if (temp > 28) color = { name: "清爽薄荷", hex: "#a7ffeb" };
            else if (temp < 18) color = { name: "大地焦糖", hex: "#cd853f" };
            else color = { name: "莫蘭迪藍", hex: "#b0c4de" };

            document.getElementById('color-dot').style.backgroundColor = color.hex;
            document.getElementById('color-name').innerText = color.name;
            document.getElementById('color-name').style.color = color.hex;
        }

        function changeStyle(s) { currentStyle = s; document.querySelectorAll('.style-btn').forEach(btn => btn.classList.toggle('active', btn.id === s)); renderOOTD(); }
        function switchPage(p) { document.querySelectorAll('.page-content, .nav-item').forEach(el => el.classList.remove('active')); document.getElementById(`page-${p}`).classList.add('active'); document.getElementById(`tab-${p}`).classList.add('active'); if (p === 'detail') setTimeout(renderRainChart, 50); lucide.createIcons(); }

        function renderRainChart() {
            const ctx = document.getElementById('rainChart').getContext('2d'), h = new Date().getHours();
            if (rainChart) rainChart.destroy();
            rainChart = new Chart(ctx, { type: 'line', data: { labels: Array.from({length: 12}, (_, i) => `${(h + i) % 24}:00`), datasets: [{ data: currentData.hourly.precipitation_probability.slice(h, h + 12), borderColor: '#818cf8', backgroundColor: 'rgba(129, 140, 248, 0.1)', fill: true, tension: 0.4, pointRadius: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#444', size: 9 }, grid: { display: false } }, y: { min: 0, max: 100, display: false } } } });
        }

        function renderWeekly(daily) {
            const days = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
            document.getElementById('weekly-forecast').innerHTML = daily.time.slice(0, 7).map((t, i) => `
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-white/40 w-8">${i === 0 ? '今' : days[new Date(t).getDay()]}</span>
                    <div class="flex-1 h-[2px] bg-white/5 mx-4 rounded-full"></div>
                    <div class="flex gap-3 text-xs font-black"><span>${Math.round(daily.temperature_2m_max[i])}°</span><span class="text-white/20">${Math.round(daily.temperature_2m_min[i])}°</span></div>
                </div>`).join('');
        }

        // 初始化啟動
        window.onload = () => {
            initSelectors(); 
            getLocation();
        };
    </script>
</body>
</html>
